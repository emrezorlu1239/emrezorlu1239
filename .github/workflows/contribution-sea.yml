name: Refresh profile

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/contribution_sea.py
      - scripts/latest_project.py
      - .github/workflows/contribution-sea.yml

permissions:
  contents: write

concurrency:
  group: contribution-sea
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Draw the latest contribution sea
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/contribution_sea.py
      - name: Find latest public project
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/latest_project.py
      - name: Publish changed artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-sea.svg README.md
          if git diff --cached --quiet; then
            echo "Contribution sea is already current."
            exit 0
          fi
          git commit -m "Refresh profile activity"
          git push
